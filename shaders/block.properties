block.10002 = minecraft:tall_grass:half=lower minecraft:tall_grass:half=upper minecraft:large_fern:half=lower minecraft:large_fern:half=upper minecraft:sunflower:half=lower minecraft:sunflower:half=upper minecraft:lilac:half=lower minecraft:lilac:half=upper minecraft:rose_bush:half=lower minecraft:rose_bush:half=upper minecraft:peony:half=lower minecraft:peony:half=upper minecraft:tall_seagrass:half=lower minecraft:tall_seagrass:half=upper minecraft:tall_dry_grass minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots
