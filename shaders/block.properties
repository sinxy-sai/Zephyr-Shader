# M12 - TRANSLUCENT render layer. Iris 1.21 routes water, ice, glass and
# stained glass through ONE gbuffers_water / shadow program, so mc_Entity.x is
# the only way to tell them apart. Complementary uses 30000-32020, BSL
# 20000-20270, Solas 10000-10216 for exactly the same split. Colour itself
# comes from the texture, so all 16 dye colours share one ID.
block.11000 = minecraft:water minecraft:flowing_water minecraft:bubble_column
block.11001 = minecraft:ice minecraft:frosted_ice minecraft:packed_ice minecraft:blue_ice
block.11002 = minecraft:glass minecraft:glass_pane
