# Zephyr M11 - block category IDs consumed by mc_Entity.x in gbuffers/shadow
# vertex shaders. Iris 1.8.x maps these names to 10000+ IDs.
# 10000 = small ground plants, 10001 = single flowers, 10002 = tall plants,
# 10003 = leaves, 10004 = vines. Waving strength/mask is chosen per category.
#
# 1.21 tall plants carry a `half` blockstate; both halves must be listed (BSL /
# Complementary style) or the upper half never matches. Verified in-game on
# 2026-11-08: the custom ID map itself resolves correctly on Iris 1.8.8.
block.10000 = minecraft:grass minecraft:short_grass minecraft:fern minecraft:bush minecraft:seagrass minecraft:nether_sprouts minecraft:short_dry_grass minecraft:pink_petals minecraft:wildflowers minecraft:leaf_litter
