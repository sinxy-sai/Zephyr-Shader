# M20 - low-chroma panes. M17 peak-normalised every glass colour to its
# brightest channel, which erased DENSITY: white / black / tinted glass all
# became (1,1,1) and rendered as clear air. Give them their own IDs so
# gbuffers_water can assign an explicit absorption (Complementary uses a
# minimum opacity + Fresnel for the same reason).
block.11005 = minecraft:white_stained_glass minecraft:white_stained_glass_pane
block.11006 = minecraft:black_stained_glass minecraft:black_stained_glass_pane
block.11007 = minecraft:tinted_glass
