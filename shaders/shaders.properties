# Zephyr Z1 - Iris 1.8.x / Minecraft 1.21.1
# allowUnknownShaders=false: only well-known directives are used here.
clouds=off
shadowMapResolution=4096
shadowDistance=112.0
sunPathRotation=0.0
# TAA history (colortex6) is read AND written by composite2 in the same pass.
# Iris supplies an implicit ping-pong pair for such a feedback attachment.
# Do NOT add a flip. line here: M7 proved it breaks the history on Iris 1.8.8.
# M13: real alpha blending for the translucent layer. Turn off the blanket
# blend, then re-enable it ONLY for colortex0 (the colour buffer); colortex1/2
# keep the un-blended material id / normal. colortex0.a now holds the real
# alpha (matId moved to colortex1.a), so SRC_ALPHA is no longer pinned at 1.
# alphaTest must be off or Iris drops the low-alpha centre of glass textures
# before our fragment shader ever sees it (photon / iterationT do the same).
blend.gbuffers_water = off
# Alpha result = srcAlpha (ONE / ZERO), so colortex0.a stays a per-pixel glass
# mask instead of saturating to 1. The final pass uses it to restore the tint.
blend.gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
alphaTest.gbuffers_water = off
# M22: held translucent items (stained glass, ice) need the SAME real-alpha
# blend, otherwise gbuffers_hand_water's alpha is dead data and the item is
# shaded as an opaque solid -> nearly invisible. colortex8 (glass layer) is
# not blended, so the held item writes its own coverage directly.
blend.gbuffers_hand_water = off
blend.gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
alphaTest.gbuffers_hand_water = off
# M24: gbuffers_hand is NOT a glass program. M23 gave it a translucent blend
# and a c.a<0.95 glass branch, which made cutout items (torch) write a glass
# coverage mask over their whole transparent quad -> rectangular colour panel.
# Held glass is handled exclusively by gbuffers_hand_water above.

# ---------------------------------------------------------------------------
# M29 - SHADER OPTIONS (OptiFine / Iris custom option syntax)
# Every option name below IS a GLSL macro in shaders/lib/settings.glsl; the
# loader injects the chosen value as a #define before compiling each program.
# Labels and tooltips: shaders/lang/en_US.lang and shaders/lang/zh_CN.lang.
# ---------------------------------------------------------------------------

# Quality presets. Zephyr's toggles are NUMERIC macros (#define X 1) rather
# than valueless #ifdef flags, so a preset must use X=0 / X=1. The "!" form is
# only valid for valueless boolean defines and makes Iris log
# "Invalid pack option". Each tier inherits from the previous one.
profile.LOW    = TAA_ENABLED=0 AO_ENABLED=0 SSR_ENABLED=0 VL_ENABLED=0 PUDDLE_ENABLED=0 shadowMapResolution=1024 shadowDistance=96.0 BLOOM_STRENGTH=0.70 BLOOM_HALO_STRENGTH=0.20
profile.MEDIUM = profile.LOW TAA_ENABLED=1 AO_ENABLED=1 PUDDLE_ENABLED=1 shadowMapResolution=2048 shadowDistance=128.0 BLOOM_STRENGTH=0.85 BLOOM_HALO_STRENGTH=0.30
profile.HIGH   = profile.MEDIUM SSR_ENABLED=1 VL_ENABLED=1 shadowMapResolution=4096 shadowDistance=160.0 BLOOM_STRENGTH=0.95 BLOOM_HALO_STRENGTH=0.35
profile.ULTRA  = profile.HIGH shadowMapResolution=4096 shadowDistance=192.0

# Main screen: preset selector + sub-page buttons. [name] opens a sub-page,
# <empty> is a spacer, <profile> is the built-in preset cycle button.

# shadowMapResolution / shadowDistance are built-in Iris directives, NOT
# option macros: listing them on a screen makes Iris log "Unable to resolve
# shader pack option menu element". Keep them in profiles only.







# Numeric macros rendered as sliders. The GLSL #define is the default value.

# M34 - option screens. Two columns everywhere, every row padded with
# <empty>, and NO option repeated between the main screen and a sub-page.
screen.columns = 2
screen = <profile> <empty> [quality] [lighting] [sky] [post] [material] [weather] [water] <empty>

screen.quality.columns = 2
screen.quality = TAA_ENABLED AO_ENABLED SSR_ENABLED VL_ENABLED SHADOW_ENABLED CLOUD_ENABLED PUDDLE_ENABLED LIGHTNING_ENABLED <empty> TAA_MIN_BLEND

screen.lighting.columns = 2
screen.lighting = HAND_LIGHT_ENABLED HAND_LIGHT_INTENSITY EMISSIVE_HDR_CAP LIGHT_SUN_INTENSITY LIGHT_SKY_INTENSITY <empty> SHADOW_COLOR_STRENGTH SHADOW_SOFTNESS NIGHT_AMBIENT_FLOOR <empty>

screen.sky.columns = 2
screen.sky = NIGHT_SKY_ENABLED NIGHT_SKY_STRENGTH STAR_BRIGHTNESS MOON_BRIGHTNESS MOON_HALO_STRENGTH <empty> CLOUD_COVERAGE CLOUD_DENSITY ATMOSPHERE_DENSITY <empty>

screen.post.columns = 2
screen.post = BLOOM_STRENGTH BLOOM_HALO_STRENGTH BLOOM_THRESHOLD GRADE_SATURATION GRADE_CONTRAST EXPOSURE_EV <empty> TONEMAP_MODE TAA_JITTER_SCALE <empty>

screen.material.columns = 2
screen.material = GLASS_ABSORPTION TRANSLUCENT_TINT_STRENGTH GLASS_NEUTRAL_VEIL GLASS_EDGE_STRENGTH <empty> WAVE_ENABLED WAVE_AMPLITUDE WAVE_RAIN_BOOST <empty> POM_ENABLED POM_DEPTH POM_BUMP <empty> LEAF_SSS_ENABLED LEAF_TRANSMISSION LEAF_VITALITY GLASS_SSS_ENABLED GLASS_SSS_STRENGTH <empty> <empty>

screen.water.columns = 2
screen.water = WATER_VOLUME_ENABLED WATER_FOG_DENSITY WATER_PARTICLE_ENABLED WATER_PARTICLE_DENSITY WATER_PARTICLE_BRIGHTNESS <empty> CAUSTICS_ENABLED CAUSTICS_STRENGTH WATER_VL_ENABLED WATER_VL_STRENGTH WATER_PARTICLE_NIGHT_BOOST <empty> WATER_WAVE_ENABLED WATER_SSS_ENABLED WATER_SSS_STRENGTH WATER_GLITTER_ENABLED WATER_GLITTER_STRENGTH <empty> <empty> <empty> WATER_BODY_ENABLED WATER_ATTEN_RATE WATER_SCATTER_RATE WATER_BOTTOM_MIX WATER_REFRACT_STRENGTH WATER_BODY_MIX WATER_REFL_ENABLED WATER_REFL_GAIN WATER_REFL_ENV_MIX WATER_REFL_NEAR_KEEP WATER_REFL_CLOUD <empty>

screen.weather.columns = 2
screen.weather = PUDDLE_STRENGTH PUDDLE_RIPPLE RAIN_BLOOM_BOOST LIGHTNING_INTENSITY STORM_CLOUD_COVERAGE <empty> RAIN_FOG_DIST_POW FOG_DENSITY <empty> <empty>

sliders = BLOOM_STRENGTH BLOOM_HALO_STRENGTH AO_STRENGTH CLOUD_COVERAGE GLASS_ABSORPTION TAA_MIN_BLEND SHADOW_COLOR_STRENGTH HAND_LIGHT_INTENSITY NIGHT_SKY_STRENGTH STAR_BRIGHTNESS WAVE_AMPLITUDE EXPOSURE_EV GRADE_SATURATION GRADE_CONTRAST LEAF_VITALITY LEAF_TRANSMISSION WATER_FOG_DENSITY WATER_PARTICLE_DENSITY WATER_PARTICLE_BRIGHTNESS CAUSTICS_STRENGTH WATER_VL_STRENGTH WATER_PARTICLE_NIGHT_BOOST POM_DEPTH POM_BUMP GLASS_SSS_STRENGTH WATER_SSS_STRENGTH WATER_GLITTER_STRENGTH WATER_ATTEN_RATE WATER_SCATTER_RATE WATER_BOTTOM_MIX WATER_REFRACT_STRENGTH WATER_BODY_MIX WATER_REFL_GAIN WATER_REFL_ENV_MIX WATER_REFL_NEAR_KEEP WATER_REFL_CLOUD
