# Zephyr Z1 - Iris 1.8.x / Minecraft 1.21.1
# allowUnknownShaders=false: only well-known directives are used here.
clouds=off
shadowMapResolution=4096
shadowDistance=112.0
sunPathRotation=0.0
# TAA history (colortex6) is read AND written by composite2 in the same pass.
# Iris supplies an implicit ping-pong pair for such a feedback attachment.
# Do NOT add a flip. line here: M7 proved it breaks the history on Iris 1.8.8.
# M13: real alpha blending for the translucent layer. Turn off the blanket
# blend, then re-enable it ONLY for colortex0 (the colour buffer); colortex1/2
# keep the un-blended material id / normal. colortex0.a now holds the real
# alpha (matId moved to colortex1.a), so SRC_ALPHA is no longer pinned at 1.
# alphaTest must be off or Iris drops the low-alpha centre of glass textures
# before our fragment shader ever sees it (photon / iterationT do the same).
blend.gbuffers_water = off
blend.gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
alphaTest.gbuffers_water = off
